<!DOCTYPE html>
<html>
  <head>
    <link type="text/css" rel="stylesheet" href="stylesheets/style.css"/>
    <style type="text/css">

      #states path {
        fill: #ccc;
        stroke: #fff;
      }

      path.arc {
        pointer-events: none;
        fill: none;
        stroke: #000;
      }

      path.cell {
        fill: none;
        pointer-events: all;
      }

      circle {
        fill: steelblue;
        fill-opacity: .8;
        stroke: #fff;
      }

      #cells.voronoi path.cell {
        stroke: brown;
      }

      #cells g path.arc {
        stroke-width: 0.3;
      }

      #cells g:hover path.arc {
        display: inherit;
      }

    </style>
  </head>
  <body>
    <h2>
      <span>MLH Hackathons</span>, PennApps<br>
      Major League Hacking 2013
    </h2>
    <!--<div style="position:absolute;bottom:0;font-size:18px;">-->
      <!--<input type="checkbox" id="voronoi"> <label for="voronoi">Show Voronoi</label>-->
    <!--</div>-->
    <div style="position:absolute;bottom:0;font-size:18px;">
      <input type="checkbox" id="showalledges"> <label for="showalledges">Hide/Show All Edges</label>
    </div>
    <script type="text/javascript" src="d3/d3.js"></script>
    <script type="text/javascript" src="d3/d3.csv.js"></script>
    <script type="text/javascript" src="d3/d3.geo.js"></script>
    <script type="text/javascript" src="d3/d3.geom.js"></script>
    <script type="text/javascript">

var w = 1280,
    h = 800;

var projection = d3.geo.azimuthal()
    .mode("equalarea")
    .origin([-98, 38])
    .scale(200)
    .translate([640, 360]);

var path = d3.geo.path()
    .projection(projection);

var svg = d3.select("body").insert("svg:svg", "h2")
    .attr("width", w)
    .attr("height", h);

var states = svg.append("svg:g")
    .attr("id", "states");

var circles = svg.append("svg:g")
    .attr("id", "circles");

var cells = svg.append("svg:g")
    .attr("id", "cells");

d3.select("#voronoi").on("change", function() {
  cells.classed("voronoi", this.checked);
});

var toggleEdges = (function() {
  var display = "inherit";

  return function() {
    display = display == "inherit" ? "none" : "inherit";
    d3.selectAll("path.arc").attr("display", display);
  }
})();

d3.select("#showalledges").on("change", toggleEdges);

d3.json("data/world-countries.json", function(collection) {
  states.selectAll("path")
      .data(collection.features)
    .enter().append("svg:path")
      .attr("d", path);
});

d3.csv("data/pennapps.csv", function(flights) {
  var linksByOrigin = {},
      countByAirport = {},
      locationByAirport = {},
      positions = [];

  var arc = d3.geo.greatArc()
      .source(function(d) { return locationByAirport[d.source]; })
      .target(function(d) { return locationByAirport[d.target]; });

  flights.forEach(function(flight) {
    var origin = flight.origin,
        destination = flight.destination,
        links = linksByOrigin[origin] || (linksByOrigin[origin] = []);
    links.push({source: origin, target: destination});
    countByAirport[origin] = (countByAirport[origin] || 0) + 1;
    countByAirport[destination] = (countByAirport[destination] || 0) + 1;
  });


  d3.csv("data/universities.csv", function(airports) {
    //console.log(airports);

    // Only consider airports with at least one flight.
    airports = airports.filter(function(airport) {
      if (countByAirport[airport.name]) {
        var location = [+airport.longitude, +airport.latitude];
        locationByAirport[airport.name] = location;
        positions.push(projection(location));
        return true;
      }
    });

    // Compute the Voronoi diagram of airports' projected positions.
    var polygons = d3.geom.voronoi(positions);

    var g = cells.selectAll("g")
        .data(airports)
        .enter().append("svg:g");

    g.append("svg:path")
        .attr("class", "cell")
        .attr("d", function(d, i) { return "M" + polygons[i].join("L") + "Z"; })
        .on("mouseover", function(d, i) { d3.select("h2 span").text(d.name); });

    //console.log(linksByOrigin);

    g.selectAll("path.arc")
        .data(function(d) { return linksByOrigin[d.name] || []; })
      .enter().append("svg:path")
        .attr("class", "arc")
        .attr("d", function(d) { return path(arc(d)); });

    circles.selectAll("circle")
        .data(airports)
      .enter().append("svg:circle")
        .attr("cx", function(d, i) { return positions[i][0]; })
        .attr("cy", function(d, i) { return positions[i][1]; })
        .attr("r", 5)//function(d, i) { return Math.sqrt(countByAirport[d.name]); })
        // smallest circles on top
        .sort(function(a, b) { return countByAirport[b.name] - countByAirport[a.name]; });
  });
});

    </script>
  </body>
</html>
